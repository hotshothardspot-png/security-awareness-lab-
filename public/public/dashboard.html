
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Lab Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f5;
      padding: 20px;
    }
    main {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    h1 { color: #222; }
    .notice {
      background: #e8f5e9;
      padding: 12px;
      border-radius: 8px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #222;
      color: white;
    }
    #status { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Security Assessment Dashboard</h1>
    <p class="notice">
      Authorised training environment. No passwords are collected.
    </p>
    <button id="refresh">Refresh assessment events</button>
    <p id="status">No events loaded.</p>
    <div id="events"></div>
  </main>

  <script>
    document.getElementById("refresh").onclick = async () => {
      document.getElementById("status").textContent =
        "Dashboard access requires administrator authentication.";
    };
  </script>
</body>
</html>
